<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La penúltima pista 💚</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top, #21483c 0%, #0b211b 45%, #06110e 100%);
            color: #f4f8f5;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(5, 25, 19, 0.88);
            border: 1px solid rgba(170, 235, 198, 0.35);
            border-radius: 24px;
            box-shadow: 0 0 45px rgba(100, 220, 160, 0.15);
            animation: aparecer 1.2s ease;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 15px;
            animation: latido 2s infinite;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 30px;
            font-weight: normal;
            color: #bdf0d2;
        }

        p {
            font-size: 19px;
            line-height: 1.8;
            margin: 15px 0;
        }

        .cofre {
            font-size: 22px;
            margin: 25px 0;
            color: #c8f3d9;
            font-weight: bold;
        }

        .virgo {
            display: inline-block;
            margin: 10px 0 20px;
            padding: 10px 24px;
            border: 1px solid rgba(189, 240, 210, 0.4);
            border-radius: 30px;
            font-size: 23px;
            color: #c8f3d9;
        }

        .final {
            margin-top: 30px;
            font-size: 17px;
            color: #a8c4b3;
            font-style: italic;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 38px 22px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">💚</div>

        <h1>La penúltima pista</h1>

        <p>Ya casi estás al final…</p>

        <p class="cofre">
            Busca un pequeño cofre. ✨
        </p>

        <p>
            Dentro encontrarás algo elegido especialmente para ti,
            algo que dicen que le viene muy bien a tu signo:
        </p>

        <div class="virgo">
            ♍ Virgo
        </div>

        <p>
            Cuando lo encuentres,<br>
            <strong>ábrelo.</strong>
        </p>

        <p class="final">
            Y recuerda…<br><br>
            todavía queda una última sorpresa. 💚
        </p>

    </div>

</body>
</html>
